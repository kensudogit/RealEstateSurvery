# ローカル開発用。
#
# ビルドコンテキストはリポジトリのルートで統一し、Dockerfile もルートの
# ものを使う（デプロイ先と同じ構成にして、環境ごとの差異を減らすため）。
# ソースはマウントするので dev ステージを指定する。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: realestate
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d realestate"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/realestate
      REDIS_URL: redis://redis:6379/0
    volumes:
      # REPO_ROOT が /srv を指すので、ルートと同じ相対配置でマウントする。
      - ./backend:/srv/backend
      - ./config:/srv/config:ro
      - ./templates:/srv/templates:ro
      - ./tools:/srv/tools:ro
      - ./data:/data
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/realestate
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/srv/backend
      - ./config:/srv/config:ro
      - ./templates:/srv/templates:ro
      - ./tools:/srv/tools:ro
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # 外部 API のレート制限に当てないよう同時実行は絞る（SKILL.md 10章）
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["3000:3000"]
    depends_on: [backend]
    command: npm run dev

volumes:
  pgdata:
